name: Windows release

# Pushing a tag like v1.0.0 builds LumenCinema.exe and attaches it to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: build-exe.bat
        shell: cmd
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/LumenCinema.exe
          body: |
            **Windows:** download `LumenCinema.exe` and double-click it. The site opens in your browser at http://localhost:8000 (admin at `/admin`, login `admin` / `admin`).

            Settings and orders are kept in a `lumen-data` folder next to the .exe. Put your free [TMDB API key](https://www.themoviedb.org/settings/api) in `lumen-data\config.json` (`tmdb_api_key`) so movies load.

            Windows may show a SmartScreen warning because the file is not code-signed: choose **More info**, then **Run anyway**.

            **Docker / umbrelOS:** `ghcr.io/aaxxeellii/lumen-cinema` - see the README.
